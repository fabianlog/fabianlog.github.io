<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The personal website of Fabian Roh.">
    <meta name="theme-color" content="#101719">
    <title>fabianlog — Fabian Roh</title>
    <link rel="canonical" href="https://fabianlog.github.io/">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101719'/%3E%3Cpath d='M12 25V11q0-5 5-5h5v4h-4q-2 0-2 2v2h6v4h-6v7z' fill='%23b6f36a'/%3E%3C/svg%3E">
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101719; color: #f2f6f3; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
      header, main, footer { width: min(100% - 3rem, 68rem); margin-inline: auto; }
      header { padding-block: 2rem; font-size: 1rem; font-weight: 650; letter-spacing: -.025em; }
      header span { color: #b6f36a; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 5rem; }
      .label { color: #b6f36a; font-size: 1rem; margin: 0 0 1.5rem; }
      h1 { font-size: clamp(3rem, 10vw, 7.5rem); font-weight: 550; letter-spacing: -.065em; line-height: 1.05; margin: 0 0 1.5rem; }
      .intro { font-size: clamp(1.125rem, 2.5vw, 1.5rem); line-height: 1.6; color: #bbc7c4; margin: 0; }
      a { color: #f2f6f3; text-underline-offset: .35em; text-decoration-thickness: 1px; }
      a:hover { color: #b6f36a; }
      a:focus-visible { outline: 2px solid #b6f36a; outline-offset: 6px; border-radius: 2px; }
      .profile { margin-top: 2.5rem; font-size: 1rem; line-height: 1.6; }
      footer { border-top: 1px solid #34413f; padding-block: 1.5rem; color: #a9b6b2; font-size: .875rem; line-height: 1.6; }
      @media (max-width: 480px) { header, main, footer { width: calc(100% - 2rem); } main { padding-block: 4rem; } }
    </style>
  </head>
  <body>
    <header>fabian<span>log</span></header>
    <main>
      <p class="label">Hello, I'm Fabian.</p>
      <h1>Fabian Roh.</h1>
      <p class="intro">Welcome to my corner of the web.</p>
      <p class="profile"><a href="https://github.com/fabiankmroh">Find me on GitHub</a></p>
    </main>
    <footer>fabianlog.github.io</footer>
  </body>
</html>
