media:
  - name: images
    label: Article images
    input: assets/images
    output: /assets/images
    extensions: [jpg, jpeg, png, webp, gif, avif]
    rename: safe

content:
  - name: articles
    label: Articles
    type: collection
    path: _articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Short description
        type: text
        description: Optional introduction shown in the article list.
      - name: cover
        label: Cover image
        type: image
        options:
          media: images
      - name: cover_alt
        label: Cover image description
        type: string
        description: Describe the cover image for readers using a screen reader.
      - name: body
        label: Article
        type: rich-text
        required: true
        description: Add links and inline pictures using the editor. Saving publishes the article to the website.
        options:
          format: markdown
          media: images
          extensions: [jpg, jpeg, png, webp, gif, avif]
          rename: safe
